[package]
name = "fp-haptics"
version = "0.1.0"
description = "Synchronises interactive devices (TCode, Buttplug/Intiface, The Handy) with video playback from funscripts"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fp-core.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Buttplug / Intiface: plain ws:// (Intiface runs on the same machine or LAN).
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# The Handy cloud API (HTTPS).
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tiny_http.workspace = true
