[package]
name = "frameplayerx"
# Version is calculated by git-cliff in CI and stamped before building.
# Local builds use this placeholder; it is never shipped.
version = "0.0.0-dev"
description = "Native VR video player for the Valve Steam Frame"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ash.workspace = true
crossbeam-channel.workspace = true
egui.workspace = true
fp-core.workspace = true
fp-haptics.workspace = true
fp-library.workspace = true
fp-media.workspace = true
fp-remote.workspace = true
fp-render.workspace = true
fp-sources.workspace = true
fp-updater.workspace = true
fp-xr.workspace = true
glam.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log.workspace = true
# Source PIN protection PBKDF2 hashing.
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
