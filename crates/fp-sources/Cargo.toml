[package]
name = "fp-sources"
version = "0.1.0"
description = "FramePlayerX media sources: local folders, HTTP(S), WebDAV, DLNA/UPnP, DeoVR/HereSphere feeds and SMB2/3, with random-access ByteSources for the demuxer"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["smb"]
# Pure-Rust SMB2/3 client (smb2, on a tokio runtime of its own).
smb = ["dep:smb2", "dep:tokio"]

[dependencies]
fp-core.workspace = true
base64.workspace = true
log.workspace = true
percent-encoding = "2.3"
quick-xml = "0.38"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, features = ["rustls"] }
url = "2.5"

smb2 = { version = "0.36.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
