[package]
name = "fp-sources"
version = "0.1.0"
description = "FramePlayerX media sources: local folders, HTTP(S), WebDAV, DLNA/UPnP, DeoVR/HereSphere feeds and SMB2/3, with random-access ByteSources for the demuxer"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["smb"]
# Pure-Rust SMB2/3 client (smb-rs in its blocking, multi-threaded mode).
smb = ["dep:smb", "dep:picky-krb"]

[dependencies]
fp-core.workspace = true
base64.workspace = true
log.workspace = true
percent-encoding = "2.3"
quick-xml = "0.38"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, features = ["rustls"] }
url = "2.5"

# smb-rs: sync mode (no async runtime), NTLM through sspi with the ring backend.
smb = { version = "0.12.1", default-features = false, features = ["multi_threaded", "sign", "encrypt"], optional = true }
# sspi 0.21.3 (pinned exactly by smb 0.12.1) fails to compile against
# picky-krb 0.12.5, which added an enum variant in a patch release. Pin the
# last compatible release until smb moves to a newer sspi.
picky-krb = { version = "=0.12.4", optional = true }

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
