[package]
name = "frameplayerx-install"
version = "0.1.0"
description = "PC-side installer: puts FramePlayerX on a paired Steam Frame over SSH and adds it to the Steam library"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "frameplayerx-install"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
fp-updater.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# Plain HTTP to the headset's devkit service when pairing.
ureq.workspace = true

[dev-dependencies]
zip.workspace = true
