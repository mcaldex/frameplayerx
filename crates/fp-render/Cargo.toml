[package]
name = "fp-render"
version = "0.1.0"
description = "FramePlayerX Vulkan renderer: per-pixel VR projections, YUV video, egui panels"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ash.workspace = true
bytemuck = { version = "1", features = ["derive"] }
egui.workspace = true
fp-core.workspace = true
fp-media.workspace = true
glam = { workspace = true, features = ["bytemuck"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
log.workspace = true
thiserror.workspace = true

[build-dependencies]
naga = { version = "28", features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
png = "0.18"
