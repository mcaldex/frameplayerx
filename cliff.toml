# git-cliff configuration — https://git-cliff.org
# Generates categorised release notes from conventional commits.
# CI uses `git cliff --bumped-version` to calculate the next stable SemVer
# (a beta appends -beta.N to it) and
# `git cliff --unreleased --strip header` for the GitHub Release body.
#
# Versions count from the last stable tag (vX.Y.Z) only: beta tags are
# ignored, so they don't bump themselves (beta.1 -> beta.2) or hide the
# commits a stable release needs to list.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
  {% if commit.scope %} *({{ commit.scope }})*{% endif %}\
  {% if commit.breaking %} **BREAKING**{% endif %} \
  ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/remotesojourner/frameplayerx/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔧 Refactor" },
    { message = "^docs", group = "📖 Documentation" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^style", group = "🎨 Style" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "⚙️ Maintenance" },
    { message = "^ci", group = "⚙️ Maintenance" },
    { message = "^build", group = "⚙️ Maintenance" },
    # A merge only repeats the commits it brings in.
    { message = "^Merge (pull request|branch|remote-tracking branch) ", skip = true },
    # Catch-all: commits not following any convention still appear.
    { message = ".*", group = "📦 Other" },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'

[bump]
initial_tag = "v0.4.0"
features_always_bump_minor = true
breaking_always_bump_major = true
