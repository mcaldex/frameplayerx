<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- The download button for the Desktop Mode uninstaller. One of a set
       with install-button: same size, shape and type. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CA0FF"/>
      <stop offset="1" stop-color="#AA6EFF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="238" height="58" rx="12" fill="#161A26" stroke="url(#accent)" stroke-width="2"/>
  <!-- bin -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 20H39M26 20V17.5A1.5 1.5 0 0 1 27.5 16H30.5A1.5 1.5 0 0 1 32 17.5V20"/>
    <path d="M21.5 20L23 39A2 2 0 0 0 25 41H33A2 2 0 0 0 35 39L36.5 20"/>
    <path d="M27 25V36M31 25V36"/>
  </g>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Helvetica, Arial, sans-serif">
    <text x="54" y="27" fill="#FFFFFF" font-size="16" font-weight="700">Uninstall</text>
    <text x="54" y="44.5" fill="#A9B1C3" font-size="12.5">Remove from the headset</text>
  </g>
</svg>
