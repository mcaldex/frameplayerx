  <!-- a PC -->
  <g fill="none" stroke="#1A9FFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="17" y="17" width="24" height="17" rx="2.5"/>
    <path d="M24.5 42H33.5M29 34V42"/>
  </g>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Helvetica, Arial, sans-serif">
    <text x="54" y="27" fill="#FFFFFF" font-size="16" font-weight="700">Frame Control</text>
    <text x="54" y="44.5" fill="#A9B1C3" font-size="12.5">Install from a PC</text>
  </g>
</svg>
