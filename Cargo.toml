[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unused_qualifications = "warn"

# On top of clippy's defaults; CI denies warnings.
[workspace.lints.clippy]
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"

# Dependencies used by more than one crate, so they share one version.
[workspace.dependencies]
fp-core = { path = "crates/fp-core" }
fp-ffmpeg-sys = { path = "crates/fp-ffmpeg-sys" }
fp-haptics = { path = "crates/fp-haptics" }
fp-library = { path = "crates/fp-library" }
fp-media = { path = "crates/fp-media" }
fp-remote = { path = "crates/fp-remote" }
fp-render = { path = "crates/fp-render" }
fp-sources = { path = "crates/fp-sources" }
fp-updater = { path = "crates/fp-updater" }
fp-xr = { path = "crates/fp-xr" }
fp-xr-loader = { path = "crates/fp-xr-loader" }

ash = "0.38"
base64 = "0.22"
crossbeam-channel = "0.5"
egui = { version = "0.32.3", features = ["bytemuck"] }
getrandom = "0.3"
glam = "0.33"
libc = "0.2.190"
libloading = "0.8"
log = "0.4"
openxr = { version = "0.22.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
thiserror = "2.0.18"
tiny_http = "0.12"
# No TLS by default; crates that need it add the `rustls` feature (ring and
# webpki roots), so there is no OpenSSL anywhere in the tree.
ureq = { version = "3.4", default-features = false }
# Pure-Rust inflate (zlib-rs backend); no C zlib, bzip2, zstd or lzma.
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# smb 0.12.1 with its SMB credit accounting fixed: a read the server answers
# with STATUS_PENDING lost its credits, and once they ran out every request
# on the connection waited forever. See vendor/smb/PATCHES.md.
[patch.crates-io]
smb = { path = "vendor/smb" }
