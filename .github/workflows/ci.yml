name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run from the Actions tab: on main it publishes a stable release, on any
  # other branch a beta (a GitHub pre-release). The version is calculated
  # either way.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # main: the next stable version, which git-cliff calculates from the
  # conventional commits since the last stable tag (see cliff.toml). Other
  # branches and pull requests: that version as a beta, X.Y.Z-beta.N, with
  # N one above the highest existing beta of X.Y.Z. A pushed v* tag is used
  # as it is.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      is_release: ${{ steps.calc.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Calculate version
        id: calc
        run: |
          is_release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            is_release=true
          else
            ver=$(git cliff --bumped-version)
            ver="${ver#v}"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              # git-cliff repeats the last version when nothing came since.
              if git rev-parse -q --verify "refs/tags/v$ver" > /dev/null; then
                echo "::warning::v$ver already exists and nothing was committed since: no release"
              else
                is_release=true
              fi
            else
              # A beta must sort above every stable release, also when the
              # branch has nothing new or was cut before the latest one.
              latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              latest="${latest#v}"
              if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$ver" | sort -V | head -1)" = "$ver" ]; then
                IFS=. read -r major minor patch <<< "$latest"
                ver="$major.$minor.$((patch + 1))"
              fi
              n=$(git tag -l "v$ver-beta.*" | sed -n "s/^v$ver-beta\.\([0-9]\+\)$/\1/p" | sort -n | tail -1)
              ver="$ver-beta.$((${n:-0} + 1))"
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                is_release=true
              fi
            fi
          fi
          case "$ver" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "Version $ver, pre-release: $prerelease, release: $is_release"
          {
            echo "version=$ver"
            echo "tag=v$ver"
            echo "prerelease=$prerelease"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"

  check:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          sed -i 's/^version = .*/version = "${{ needs.version.outputs.version }}"/' crates/frameplayerx/Cargo.toml
      # Pinned so a new stable release's lints cannot break CI unannounced;
      # bump deliberately (and fix what its clippy reports).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config mesa-vulkan-drivers zip
          # Ubuntu's meson (1.3) does not recognise zig's linker; use the
          # version the cross build is tested with.
          pipx install meson==1.12.1
          cargo install --locked cargo-zigbuild
      - name: Restore FFmpeg builds
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Build FFmpeg (x86_64 for tests, aarch64 for the Frame)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh x86_64 aarch64
      # Saved right away, so a later failing step does not throw it away.
      - name: Save FFmpeg builds
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Both modes: one catches public docs linking private items, the other
      # broken links in private items' docs.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps
          cargo doc --workspace --no-deps --document-private-items
      - name: Tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ffmpeg/x86_64/lib
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo test --workspace
      - name: Desktop Mode installer tests
        working-directory: tools/frame-desktop-install
        run: python3 -m unittest
      # Every screen as a flat PNG, for design review (artifact ui-preview).
      - name: UI preview
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ffmpeg/x86_64/lib
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: tools/ui-preview.sh ui-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: ui-preview/
      - name: Package for the Steam Frame (aarch64, glibc 2.28)
        run: tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frameplayerx-aarch64
          path: dist/

  # The PC-side installer, for each desktop OS.
  installer:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: frameplayerx-install-linux-x86_64
            exe: frameplayerx-install
          - os: windows-latest
            name: frameplayerx-install-windows-x86_64
            exe: frameplayerx-install.exe
          - os: macos-latest
            name: frameplayerx-install-macos-arm64
            exe: frameplayerx-install
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p frameplayerx-install
      - run: cargo build --release -p frameplayerx-install
      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          cp "target/release/${{ matrix.exe }}" "out/${{ matrix.name }}${{ endsWith(matrix.exe, '.exe') && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/

  release:
    if: needs.version.outputs.is_release == 'true'
    needs: [version, check, installer]
    runs-on: ubuntu-24.04
    # One at a time, so two runs can't publish the same version.
    concurrency: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frameplayerx-aarch64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: frameplayerx-install-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
      - name: Check the tag is free
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Another run may have published this version since it was
          # calculated; a re-run of this one finds it on this commit.
          at=$(git -C src ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already exists on $at; run the workflow again for the next version"
            exit 1
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate release notes
        run: |
          cd src
          git cliff --bump --unreleased --strip header --output ../dist/RELEASE_NOTES.md || true
          if [ ! -s ../dist/RELEASE_NOTES.md ]; then
            echo "Release $TAG" > ../dist/RELEASE_NOTES.md
          fi
          if [ "$PRERELEASE" = true ]; then
            {
              echo "Beta built from \`$GITHUB_REF_NAME\` (${GITHUB_SHA::7}). FramePlayerX offers it on the Beta channel only (Settings › Updates). Changes since the last stable release:"
              echo
              cat ../dist/RELEASE_NOTES.md
            } > ../dist/notes.md
            mv ../dist/notes.md ../dist/RELEASE_NOTES.md
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign the update manifest
        env:
          FP_RELEASE_KEY: ${{ secrets.FP_RELEASE_KEY }}
        run: |
          if [ -z "$FP_RELEASE_KEY" ]; then
            echo "::error::FP_RELEASE_KEY secret not set; an unsigned manifest.json would be refused by in-app updates"
            exit 1
          fi
          umask 077
          printf '%s\n' "$FP_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
          cargo run --manifest-path src/Cargo.toml --release -p fp-updater --bin fp-release -- sign dist/manifest.json --key "$RUNNER_TEMP/release.key"
          rm -f "$RUNNER_TEMP/release.key"
          # The signature must match the key FramePlayerX builds carry.
          cargo run --manifest-path src/Cargo.toml --release -p fp-updater --bin fp-release -- verify dist/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # releases/latest, which frameplayerx-install and the Desktop Mode
          # launcher read (and stable FramePlayerX when GitHub's release
          # list can't be read), must never point at a beta.
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/frameplayerx-*.zip
            dist/manifest.json
            dist/manifest.json.sig
            dist/framedrop.json
            dist/frameplayerx.json
            dist/frameplayerx-install-*
            src/tools/frame-desktop-install/frameplayerx-desktop-install.py
            src/tools/frame-desktop-install/Install-FramePlayerX.desktop
            src/tools/frame-desktop-install/Uninstall-FramePlayerX.desktop
