name: Translation problem
description: A wrong, awkward or missing translation in the app or the phone remote
title: "[Translation] "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. If you'd rather fix it yourself, you can edit any message on [Codeberg Translate](https://translate.codeberg.org/projects/frameplayerx/) (sign in with a Codeberg account).
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Deutsch (German)
        - Español (Spanish)
        - Français (French)
        - 日本語 (Japanese)
        - 简体中文 (Simplified Chinese)
        - English
        - Another language
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it shows
      description: The screen and what you were doing, e.g. "Settings › Playback" or "the message after saving a playlist".
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What it says
      description: The text as the app shows it. A screenshot helps too.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should say
      description: Your wording, and why if it isn't obvious (wrong meaning, too long for its button, a term Steam uses differently…).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FramePlayerX version
      description: Settings › About.
      placeholder: e.g. 0.14.0
